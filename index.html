<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18243b"><link rel="manifest" href="manifest.webmanifest"><title>PhraseFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18243b;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#18243b;color:white;padding:24px 20px}main{max-width:650px;margin:auto;padding:18px}section{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 18px #18243b0c}h1{margin:0;font-size:26px}h2{font-size:18px;margin-top:0}button,select,input,textarea{font:inherit}button{background:#243c71;color:white;border:0;border-radius:12px;padding:13px 17px;cursor:pointer}button:disabled{opacity:.4}select,input,textarea{border:1px solid #cbd2df;border-radius:10px;padding:10px;width:100%;margin:7px 0 12px}textarea{min-height:100px}label{font-size:14px;color:#526079}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.phrase{font-size:27px;line-height:1.5;font-weight:650;margin:26px 0}.muted{color:#66748a}.translation{font-size:18px}.hidden{display:none}details{margin:14px 0;border-top:1px solid #e3e6ee;padding-top:12px}summary{font-weight:650;cursor:pointer}.badge{font-size:13px;color:#526079}small{line-height:1.6}ul{padding-left:20px}li{margin:8px 0}</style></head><body><header><h1>PhraseFlow</h1><div>多言語フレーズ・リスニング教材</div></header><main><section><label>教材を選択</label><select id="lesson"></select><div class="row"><button id="reset">最初から</button><button id="export">教材をバックアップ</button></div></section><section><div class="badge" id="counter"></div><div class="phrase" id="phrase"></div><div class="translation" id="translation"></div><p><label><input id="showTranslation" type="checkbox" checked style="width:auto"> 日本語訳を表示</label></p><div class="row"><button id="prev">← 前へ</button><button id="play">▶ 再生</button><button id="next">次へ →</button></div><p><label>読み上げ速度</label><select id="speed"><option value=".75">0.75倍</option><option value="1" selected>1.0倍</option><option value="1.25">1.25倍</option></select></p><div class="row"><button id="auto">連続再生：OFF</button><button id="repeat">リピート：OFF</button></div><details><summary>単語・表現</summary><ul id="words"></ul></details><details><summary>文法解説</summary><p id="grammar"></p></details></section><section><h2>AIで作った教材を取り込む</h2><small>ChatGPT等で生成したJSONを貼り付けて追加できます。教材生成APIは未接続です。</small><textarea id="json" placeholder='{"title":"教材名","lang":"en-US","phrases":[{"text":"Hello!","ja":"こんにちは","words":[{"word":"Hello","meaning":"こんにちは"}],"grammar":"挨拶表現"}]}'></textarea><button id="import">教材を追加</button><p class="muted" id="message"></p></section><section><small>音声はiPhoneの読み上げ機能を使用します。言語によっては音声が利用できない場合があります。画面ロック中の連続再生は保証されません。教材はこの端末のブラウザに保存されます。</small></section></main><script>
const samples=[{title:"English · 日常会話",lang:"en-US",phrases:[{text:"Could you say that again?",ja:"もう一度言っていただけますか。",words:[{word:"could you",meaning:"〜していただけますか"},{word:"again",meaning:"もう一度"}],grammar:"Could you + 動詞の原形で丁寧な依頼を表す。"},{text:"I've been studying English for two years.",ja:"私は2年間英語を勉強しています。",words:[{word:"have been studying",meaning:"ずっと勉強している"},{word:"for two years",meaning:"2年間"}],grammar:"現在完了進行形 have been + 動詞ing。"}]},{title:"Français · 旅行",lang:"fr-FR",phrases:[{text:"Je voudrais réserver une table.",ja:"席を予約したいのですが。",words:[{word:"Je voudrais",meaning:"〜したいのですが"},{word:"réserver",meaning:"予約する"}],grammar:"voudrais は vouloir の条件法現在で丁寧な希望を表す。"},{text:"Où se trouve la gare ?",ja:"駅はどこにありますか。",words:[{word:"où",meaning:"どこ"},{word:"la gare",meaning:"駅"}],grammar:"Où se trouve ... ? は場所を尋ねる表現。"}]},{title:"Русский · 基本表現",lang:"ru-RU",phrases:[{text:"Здравствуйте!",ja:"こんにちは。",words:[{word:"Здравствуйте",meaning:"丁寧な挨拶"}],grammar:"初対面や目上の人にも使える挨拶。"},{text:"Где находится вокзал?",ja:"駅はどこですか。",words:[{word:"где",meaning:"どこ"},{word:"вокзал",meaning:"鉄道駅"}],grammar:"Где находится ... ? は場所を尋ねる表現。"}]}];
const $=id=>document.getElementById(id);let library;try{library=JSON.parse(localStorage.getItem("pf_library"))||samples}catch{library=samples}let lesson=0,index=0,auto=false,repeat=false,playing=false;const synth=window.speechSynthesis;function save(){localStorage.setItem("pf_library",JSON.stringify(library))}function options(){ $("lesson").replaceChildren(...library.map((x,i)=>new Option(x.title,i)));$("lesson").value=lesson}function stop(){auto=false;playing=false;synth?.cancel();$("auto").textContent="連続再生：OFF";$("play").textContent="▶ 再生"}function render(){let l=library[lesson],p=l.phrases[index];$("counter").textContent=(index+1)+" / "+l.phrases.length+" · "+l.lang;$("phrase").textContent=p.text;$("translation").textContent=p.ja;$("translation").classList.toggle("hidden",!$("showTranslation").checked);$("words").replaceChildren(...(p.words||[]).map(w=>{let li=document.createElement("li");li.textContent=w.word+" — "+w.meaning;return li}));$("grammar").textContent=p.grammar||"解説なし";$("prev").disabled=index===0;$("next").disabled=index===l.phrases.length-1}function speak(){if(!synth){$("message").textContent="このブラウザは読み上げに対応していません";return} synth.cancel();let p=library[lesson].phrases[index],u=new SpeechSynthesisUtterance(p.text);u.lang=library[lesson].lang;u.rate=Number($("speed").value);u.onend=()=>{playing=false;$("play").textContent="▶ 再生";if(auto){if(repeat){setTimeout(()=>auto&&speak(),900)}else if(index+1<library[lesson].phrases.length){index++;render();setTimeout(()=>auto&&speak(),900)}else{auto=false;$("auto").textContent="連続再生：OFF"}}};u.onerror=()=>{playing=false;auto=false;$("auto").textContent="連続再生：OFF";$("play").textContent="▶ 再生"};playing=true;$("play").textContent="■ 停止";synth.speak(u)}$("lesson").onchange=e=>{stop();lesson=Number(e.target.value);index=0;render()};$("prev").onclick=()=>{stop();index=Math.max(0,index-1);render()};$("next").onclick=()=>{stop();index=Math.min(library[lesson].phrases.length-1,index+1);render()};$("reset").onclick=()=>{stop();index=0;render()};$("play").onclick=()=>{if(playing){stop()}else speak()};$("auto").onclick=()=>{auto=!auto;$("auto").textContent="連続再生："+(auto?"ON":"OFF");if(auto&&!playing)speak()};$("repeat").onclick=()=>{repeat=!repeat;$("repeat").textContent="リピート："+(repeat?"ON":"OFF")};$("showTranslation").onchange=render;$("import").onclick=()=>{try{let x=JSON.parse($("json").value);if(!x.title||!x.lang||!Array.isArray(x.phrases)||!x.phrases.length||x.phrases.some(p=>!p.text||!p.ja))throw Error("title、lang、phrases（textとja）が必要です");library.push(x);save();stop();lesson=library.length-1;index=0;options();render();$("json").value="";$("message").textContent="教材を追加しました"}catch(e){$("message").textContent="取り込み失敗："+e.message}};$("export").onclick=()=>{let blob=new Blob([JSON.stringify(library,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="phraseflow-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};options();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
