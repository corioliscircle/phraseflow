<section><h2>教材を追加</h2><p class="notice">フレーズ・単語・文法のJSON教材を貼り付けて追加できます。現在、AIによるアプリ内自動生成は未対応です。</p><textarea id="newJson" placeholder='{"type":"words","title":"英語・基本単語","lang":"en-US","words":[{"text":"apple","ja":"りんご","pos":"名詞","example":"I have an apple.","exampleJa":"私はリンゴを持っています。"}]}'></textarea><button id="newImport">教材を取り込む</button><p id="newMessage" class="muted"></p><button id="backupAll" class="outline">全教材・学習記録をバックアップ</button></section><div id="old-phrase-anchor"><section><label>教材を選択</label><select id="lesson"></select><div class="row"><button id="reset">最初から</button><button id="export">教材をバックアップ</button></div></section><section><div class="badge" id="counter"></div><div class="phrase" id="phrase"></div><div class="translation" id="translation"></div><p><label><input id="showTranslation" type="checkbox" checked style="width:auto"> 日本語訳を表示</label></p><div class="row"><button id="prev">← 前へ</button><button id="play">▶ 再生</button><button id="next">次へ →</button></div><p><label>読み上げ速度</label><select id="speed"><option value=".75">0.75倍</option><option value="1" selected>1.0倍</option><option value="1.25">1.25倍</option></select></p><div class="row"><button id="auto">連続再生：OFF</button><button id="repeat">リピート：OFF</button></div><details><summary>単語・表現</summary><ul id="words"></ul></details><details><summary>文法解説</summary><p id="grammar"></p></details></section><section><h2>AIで作った教材を取り込む</h2><small>ChatGPT等で生成したJSONを貼り付けて追加できます。教材生成APIは未接続です。</small><textarea id="json" placeholder='{"title":"教材名","lang":"en-US","phrases":[{"text":"Hello!","ja":"こんにちは","words":[{"word":"Hello","meaning":"こんにちは"}],"grammar":"挨拶表現"}]}'></textarea><button id="import">教材を追加</button><p class="muted" id="message"></p></section><section><small>音声はiPhoneの読み上げ機能を使用します。言語によっては音声が利用できない場合があります。画面ロック中の連続再生は保証されません。教材はこの端末のブラウザに保存されます。</small></section></div></main><script>
(()=>{const seed={"words":[{"title":"英語・最重要語彙 第1集（20語）","lang":"en-US","words":[{"text":"be","ja":"〜である","pos":"動詞","example":"I want to be a teacher.","exampleJa":"私は教師になりたい。"},{"text":"have","ja":"持っている","pos":"動詞","example":"I have a question.","exampleJa":"質問があります。"},{"text":"do","ja":"する","pos":"動詞","example":"What do you do?","exampleJa":"あなたの仕事は何ですか。"},{"text":"go","ja":"行く","pos":"動詞","example":"I go to school.","exampleJa":"私は学校に通います。"},{"text":"get","ja":"得る・受け取る","pos":"動詞","example":"I get home at six.","exampleJa":"私は6時に帰宅します。"},{"text":"make","ja":"作る","pos":"動詞","example":"I make breakfast.","exampleJa":"私は朝食を作ります。"},{"text":"know","ja":"知っている","pos":"動詞","example":"I know the answer.","exampleJa":"答えを知っています。"},{"text":"think","ja":"思う・考える","pos":"動詞","example":"I think so.","exampleJa":"私もそう思います。"},{"text":"want","ja":"欲しい・〜したい","pos":"動詞","example":"I want some water.","exampleJa":"水が欲しいです。"},{"text":"need","ja":"必要とする","pos":"動詞","example":"I need help.","exampleJa":"助けが必要です。"},{"text":"time","ja":"時間","pos":"名詞","example":"What time is it?","exampleJa":"何時ですか。"},{"text":"day","ja":"日","pos":"名詞","example":"Have a nice day.","exampleJa":"良い一日を。"},{"text":"people","ja":"人々","pos":"名詞","example":"Many people live here.","exampleJa":"ここには多くの人が住んでいます。"},{"text":"good","ja":"良い","pos":"形容詞","example":"That is a good idea.","exampleJa":"それは良い考えです。"},{"text":"different","ja":"異なる","pos":"形容詞","example":"These are different.","exampleJa":"これらは異なります。"},{"text":"because","ja":"なぜなら","pos":"接続詞","example":"I stayed home because it rained.","exampleJa":"雨が降ったので家にいました。"},{"text":"before","ja":"〜の前に","pos":"前置詞・接続詞","example":"Call me before you leave.","exampleJa":"出発前に電話してください。"},{"text":"after","ja":"〜の後に","pos":"前置詞・接続詞","example":"Let's talk after lunch.","exampleJa":"昼食後に話しましょう。"},{"text":"always","ja":"いつも","pos":"副詞","example":"I always drink tea.","exampleJa":"私はいつもお茶を飲みます。"},{"text":"sometimes","ja":"ときどき","pos":"副詞","example":"I sometimes walk to work.","exampleJa":"私はときどき歩いて出勤します。"}]},{"title":"ロシア語・最重要語彙 第1集（20語）","lang":"ru-RU","words":[{"text":"быть","ja":"〜である","pos":"動詞","example":"Я хочу быть врачом.","exampleJa":"私は医者になりたいです。"},{"text":"иметь","ja":"持つ","pos":"動詞","example":"Я хочу иметь больше времени.","exampleJa":"もっと時間が欲しいです。"},{"text":"делать","ja":"する・作る","pos":"動詞","example":"Что ты делаешь?","exampleJa":"何をしていますか。"},{"text":"идти","ja":"歩いて行く（一方向）","pos":"動詞","example":"Я иду домой.","exampleJa":"私は歩いて家に帰るところです。"},{"text":"ехать","ja":"乗り物で行く（一方向）","pos":"動詞","example":"Я еду в Москву.","exampleJa":"私はモスクワへ向かっています。"},{"text":"знать","ja":"知っている","pos":"動詞","example":"Я знаю ответ.","exampleJa":"私は答えを知っています。"},{"text":"думать","ja":"考える","pos":"動詞","example":"Я думаю о работе.","exampleJa":"私は仕事について考えています。"},{"text":"хотеть","ja":"欲する・〜したい","pos":"動詞","example":"Я хочу пить.","exampleJa":"私は飲み物が欲しいです。"},{"text":"мочь","ja":"〜できる","pos":"動詞","example":"Я могу помочь.","exampleJa":"私は手伝えます。"},{"text":"говорить","ja":"話す","pos":"動詞","example":"Я говорю по-русски.","exampleJa":"私はロシア語を話します。"},{"text":"время","ja":"時間","pos":"中性名詞","example":"У меня нет времени.","exampleJa":"私には時間がありません。"},{"text":"день","ja":"日・昼","pos":"男性名詞","example":"Сегодня хороший день.","exampleJa":"今日は良い日です。"},{"text":"человек","ja":"人","pos":"男性名詞","example":"Этот человек — мой друг.","exampleJa":"この人は私の友人です。"},{"text":"хороший","ja":"良い","pos":"形容詞","example":"Это хороший вопрос.","exampleJa":"それは良い質問です。"},{"text":"большой","ja":"大きい","pos":"形容詞","example":"Это большой город.","exampleJa":"これは大きな都市です。"},{"text":"потому что","ja":"なぜなら","pos":"接続表現","example":"Я дома, потому что устал.","exampleJa":"疲れたので家にいます。"},{"text":"сегодня","ja":"今日","pos":"副詞","example":"Сегодня холодно.","exampleJa":"今日は寒いです。"},{"text":"завтра","ja":"明日","pos":"副詞","example":"Увидимся завтра.","exampleJa":"また明日会いましょう。"},{"text":"всегда","ja":"いつも","pos":"副詞","example":"Я всегда читаю утром.","exampleJa":"私はいつも朝に読みます。"},{"text":"иногда","ja":"ときどき","pos":"副詞","example":"Иногда я готовлю дома.","exampleJa":"ときどき家で料理します。"}]}],"grammar":[{"title":"英語・基本文法 第1集（8課）","lang":"en-US","lessons":[{"title":"第1課：基本語順：SVO","explanation":"英語の平叙文は通常「主語＋動詞＋目的語」の順です。目的語が不要な動詞もあります。","examples":[{"text":"I study English.","ja":"私は英語を勉強します。"}]},{"title":"第2課：be動詞の現在形","explanation":"主語に応じて am / is / are を使います。状態・性質・所在などを表します。","examples":[{"text":"She is busy.","ja":"彼女は忙しいです。"}]},{"title":"第3課：一般動詞の現在形","explanation":"習慣や一般的事実を表します。三人称単数現在では動詞に通常 -s / -es が付きます。","examples":[{"text":"He works every day.","ja":"彼は毎日働きます。"}]},{"title":"第4課：疑問文と否定文","explanation":"一般動詞の現在形では do / does を用いて疑問文・否定文を作ります。be動詞は語順を変えて疑問文にします。","examples":[{"text":"Do you like coffee?","ja":"コーヒーは好きですか。"}]},{"title":"第5課：過去形","explanation":"過去の出来事には過去形を使います。規則動詞は通常 -ed、不規則動詞は個別に覚えます。","examples":[{"text":"I visited Kyoto yesterday.","ja":"私は昨日京都を訪れました。"}]},{"title":"第6課：現在進行形","explanation":"be動詞＋動詞の -ing 形で、今進行している動作などを表します。","examples":[{"text":"I am reading a book.","ja":"私は本を読んでいるところです。"}]},{"title":"第7課：現在完了形","explanation":"have / has＋過去分詞で、過去と現在につながりのある経験・継続・完了などを表します。","examples":[{"text":"I have lived here for three years.","ja":"私はここに3年間住んでいます。"}]},{"title":"第8課：助動詞 can と should","explanation":"can は能力・可能性・許可など、should は助言・義務の弱い表現などに使います。後ろは動詞の原形です。","examples":[{"text":"You should rest.","ja":"休んだ方がいいです。"}]}]},{"title":"ロシア語・基本文法 第1集（8課）","lang":"ru-RU","lessons":[{"title":"第1課：文字と強勢","explanation":"ロシア語はキリル文字を使います。強勢のない母音は発音が変化することがあります。教材の通常表記では強勢記号が省略されることが多いため、音声も確認しましょう。","examples":[{"text":"Спасибо.","ja":"ありがとうございます。"}]},{"title":"第2課：基本語順と現在形の быть","explanation":"ロシア語は格変化があるため語順に柔軟性があります。中立的な語順は主語＋動詞＋目的語が一般的です。現在時制の「〜である」に相当する быть は通常省略します。","examples":[{"text":"Я студент.","ja":"私は学生です。"}]},{"title":"第3課：名詞の性","explanation":"名詞には男性・女性・中性の文法上の性があります。語尾が目安になりますが例外もあります。形容詞なども性に一致します。","examples":[{"text":"Это новая книга.","ja":"これは新しい本です。"}]},{"title":"第4課：動詞の現在形","explanation":"動詞は人称と数に応じて活用します。例えば говорить は я говорю、ты говоришь、он говорит です。","examples":[{"text":"Я говорю по-русски.","ja":"私はロシア語を話します。"}]},{"title":"第5課：否定文と疑問文","explanation":"否定は通常、否定したい語の前に не を置きます。はい・いいえで答える疑問文は、語順を変えずイントネーションで示すことがあります。","examples":[{"text":"Я не понимаю.","ja":"私は理解できません。"}]},{"title":"第6課：対格：直接目的語","explanation":"対格は直接目的語などに使います。女性名詞 книга は対格で книгу になります。男性有生名詞などにも特有の変化があります。","examples":[{"text":"Я читаю книгу.","ja":"私は本を読んでいます。"}]},{"title":"第7課：前置格：場所と話題","explanation":"前置詞 в / на とともに場所を、о / об とともに話題を表すなどの用法があります。","examples":[{"text":"Я живу в Москве.","ja":"私はモスクワに住んでいます。"}]},{"title":"第8課：移動動詞の基本","explanation":"идти は徒歩で一方向へ向かう移動、ехать は乗り物で一方向へ向かう移動を表します。習慣的・往復的な移動には別の動詞を使うことがあります。","examples":[{"text":"Я еду на автобусе.","ja":"私はバスで移動しています。"}]}]}],"phrases":[{"title":"英語・実用フレーズ 第1集（8文）","lang":"en-US","phrases":[{"text":"Could you speak more slowly?","ja":"もう少しゆっくり話していただけますか。","grammar":"Could you + 動詞の原形で丁寧に依頼する。","words":[]},{"text":"What does this word mean?","ja":"この単語はどういう意味ですか。","grammar":"does を使う現在形の疑問文。","words":[]},{"text":"I'm looking for the station.","ja":"駅を探しています。","grammar":"be looking for は「〜を探している」。","words":[]},{"text":"How long does it take?","ja":"どのくらい時間がかかりますか。","grammar":"How long で時間の長さを尋ねる。","words":[]},{"text":"I'd like a cup of coffee.","ja":"コーヒーを一杯お願いします。","grammar":"I'd like は I would like の短縮形。","words":[]},{"text":"Could you write it down?","ja":"それを書いていただけますか。","grammar":"write down は「書き留める」。","words":[]},{"text":"I don't understand the question.","ja":"質問が理解できません。","grammar":"一般動詞の否定は do not + 動詞原形。","words":[]},{"text":"Is there a pharmacy nearby?","ja":"近くに薬局はありますか。","grammar":"Is there ...? で存在を尋ねる。","words":[]}]},{"title":"ロシア語・実用フレーズ 第1集（8文）","lang":"ru-RU","phrases":[{"text":"Говорите, пожалуйста, медленнее.","ja":"もう少しゆっくり話してください。","grammar":"пожалуйста は丁寧な依頼を表す。","words":[]},{"text":"Что это значит?","ja":"これはどういう意味ですか。","grammar":"что は「何」、значит は「意味する」。","words":[]},{"text":"Я ищу вокзал.","ja":"駅を探しています。","grammar":"искать は「探す」。вокзал は対格でも同形。","words":[]},{"text":"Сколько это стоит?","ja":"これはいくらですか。","grammar":"сколько は数量や値段を尋ねる。","words":[]},{"text":"Я хотел бы заказать чай.","ja":"お茶を注文したいのですが。（男性話者）","grammar":"хотел бы は男性話者の丁寧な希望表現。女性話者は хотела бы。","words":[]},{"text":"Напишите это, пожалуйста.","ja":"これを書いてください。","grammar":"напишите は複数形・丁寧形の命令形。","words":[]},{"text":"Я не понимаю.","ja":"理解できません。","grammar":"не を動詞の前に置いて否定する。","words":[]},{"text":"Где здесь аптека?","ja":"この辺りの薬局はどこですか。","grammar":"где は「どこ」、аптека は「薬局」。","words":[]}]}]};const merge=(key,items)=>{let a;try{a=JSON.parse(localStorage.getItem(key))||[]}catch{a=[]}let changed=false;for(const x of items){if(!a.some(y=>y.title===x.title&&y.lang===x.lang)){a.push(x);changed=true}}if(changed)localStorage.setItem(key,JSON.stringify(a));return changed};const p=merge("pf_library",seed.phrases),w=merge("pf_words",seed.words),g=merge("pf_grammar",seed.grammar);if(p||w||g){let el=document.createElement("div");el.className="notice";el.textContent="英語・ロシア語の新教材を追加しました。教材の選択欄から利用できます。";document.querySelector("main").prepend(el);}})();
