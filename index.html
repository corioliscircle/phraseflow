<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18243b"><link rel="manifest" href="manifest.webmanifest"><title>PhraseFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18243b;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#18243b;color:white;padding:24px 20px}main{max-width:650px;margin:auto;padding:18px}section{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 18px #18243b0c}h1{margin:0;font-size:26px}h2{font-size:18px;margin-top:0}button,select,input,textarea{font:inherit}button{background:#243c71;color:white;border:0;border-radius:12px;padding:13px 17px;cursor:pointer}button:disabled{opacity:.4}select,input,textarea{border:1px solid #cbd2df;border-radius:10px;padding:10px;width:100%;margin:7px 0 12px}textarea{min-height:100px}label{font-size:14px;color:#526079}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.phrase{font-size:27px;line-height:1.5;font-weight:650;margin:26px 0}.muted{color:#66748a}.translation{font-size:18px}.hidden{display:none}details{margin:14px 0;border-top:1px solid #e3e6ee;padding-top:12px}summary{font-weight:650;cursor:pointer}.badge{font-size:13px;color:#526079}small{line-height:1.6}ul{padding-left:20px}li{margin:8px 0}</style><style>
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;padding:12px 4px;background:#dce4f2;color:#18243b}.tabs button.active{background:#243c71;color:white}.mode{display:none}.mode.active{display:block}.card{font-size:29px;font-weight:650;line-height:1.5;margin:20px 0}.info{font-size:17px;line-height:1.8}.progress{font-size:13px;color:#637087}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.good{background:#22745c}.outline{background:#e5eaf3;color:#1b335a}.notice{background:#f0f5ff;padding:12px;border-radius:10px;font-size:13px}#wordDetails{line-height:1.8}
</style></head><body><header><h1>PhraseFlow</h1><div>多言語フレーズ・リスニング教材</div></header><main><div class="tabs"><button class="active" data-tab="phrases">フレーズ</button><button data-tab="words">単語</button><button data-tab="grammar">基本文法</button></div>
<div class="mode active" id="mode-phrases"></div>
<div class="mode" id="mode-words"><section><h2>単語学習</h2><label>単語教材</label><select id="wordLesson"></select><div class="progress" id="wordCount"></div><div class="card" id="wordText"></div><div class="info" id="wordMeaning"></div><p><label><input type="checkbox" id="wordShow" checked style="width:auto"> 日本語訳を表示</label></p><div class="toolbar"><button id="wordPrev">← 前へ</button><button id="wordPlay">▶ 再生</button><button id="wordNext">次へ →</button></div><p><label>読み上げ速度</label><select id="wordSpeed"><option value=".75">0.75倍</option><option value="1" selected>1.0倍</option><option value="1.25">1.25倍</option></select></p><div class="toolbar"><button id="wordAuto">連続再生：OFF</button><button id="wordRepeat">リピート：OFF</button></div><details><summary>品詞・活用・例文</summary><div id="wordDetails"></div><button class="outline" id="examplePlay">▶ 例文を再生</button></details><p><button id="wordLearned" class="good">✓ 習得済みにする</button></p><p class="progress" id="wordProgress"></p></section></div>
<div class="mode" id="mode-grammar"><section><h2>基本文法</h2><label>文法教材</label><select id="grammarLesson"></select><div class="progress" id="grammarCount"></div><h2 id="grammarTitle"></h2><p class="info" id="grammarBody" style="white-space:pre-wrap"></p><h3>例文</h3><div id="grammarExamples"></div><div class="toolbar"><button id="grammarPrev">← 前の課</button><button id="grammarNext">次の課 →</button></div><p><button id="grammarDone" class="good">✓ この課を完了</button></p><p class="progress" id="grammarProgress"></p></section></div>
<section><h2>教材を追加</h2><p class="notice">フレーズ・単語・文法のJSON教材を貼り付けて追加できます。現在、AIによるアプリ内自動生成は未対応です。</p><textarea id="newJson" placeholder='{"type":"words","title":"英語・基本単語","lang":"en-US","words":[{"text":"apple","ja":"りんご","pos":"名詞","example":"I have an apple.","exampleJa":"私はリンゴを持っています。"}]}'></textarea><button id="newImport">教材を取り込む</button><p id="newMessage" class="muted"></p><button id="backupAll" class="outline">全教材・学習記録をバックアップ</button></section><div id="old-phrase-anchor"><section><label>教材を選択</label><select id="lesson"></select><div class="row"><button id="reset">最初から</button><button id="export">教材をバックアップ</button></div></section><section><div class="badge" id="counter"></div><div class="phrase" id="phrase"></div><div class="translation" id="translation"></div><p><label><input id="showTranslation" type="checkbox" checked style="width:auto"> 日本語訳を表示</label></p><div class="row"><button id="prev">← 前へ</button><button id="play">▶ 再生</button><button id="next">次へ →</button></div><p><label>読み上げ速度</label><select id="speed"><option value=".75">0.75倍</option><option value="1" selected>1.0倍</option><option value="1.25">1.25倍</option></select></p><div class="row"><button id="auto">連続再生：OFF</button><button id="repeat">リピート：OFF</button></div><details><summary>単語・表現</summary><ul id="words"></ul></details><details><summary>文法解説</summary><p id="grammar"></p></details></section><section><h2>AIで作った教材を取り込む</h2><small>ChatGPT等で生成したJSONを貼り付けて追加できます。教材生成APIは未接続です。</small><textarea id="json" placeholder='{"title":"教材名","lang":"en-US","phrases":[{"text":"Hello!","ja":"こんにちは","words":[{"word":"Hello","meaning":"こんにちは"}],"grammar":"挨拶表現"}]}'></textarea><button id="import">教材を追加</button><p class="muted" id="message"></p></section><section><small>音声はiPhoneの読み上げ機能を使用します。言語によっては音声が利用できない場合があります。画面ロック中の連続再生は保証されません。教材はこの端末のブラウザに保存されます。</small></section></div></main><script>
const samples=[{title:"English · 日常会話",lang:"en-US",phrases:[{text:"Could you say that again?",ja:"もう一度言っていただけますか。",words:[{word:"could you",meaning:"〜していただけますか"},{word:"again",meaning:"もう一度"}],grammar:"Could you + 動詞の原形で丁寧な依頼を表す。"},{text:"I've been studying English for two years.",ja:"私は2年間英語を勉強しています。",words:[{word:"have been studying",meaning:"ずっと勉強している"},{word:"for two years",meaning:"2年間"}],grammar:"現在完了進行形 have been + 動詞ing。"}]},{title:"Français · 旅行",lang:"fr-FR",phrases:[{text:"Je voudrais réserver une table.",ja:"席を予約したいのですが。",words:[{word:"Je voudrais",meaning:"〜したいのですが"},{word:"réserver",meaning:"予約する"}],grammar:"voudrais は vouloir の条件法現在で丁寧な希望を表す。"},{text:"Où se trouve la gare ?",ja:"駅はどこにありますか。",words:[{word:"où",meaning:"どこ"},{word:"la gare",meaning:"駅"}],grammar:"Où se trouve ... ? は場所を尋ねる表現。"}]},{title:"Русский · 基本表現",lang:"ru-RU",phrases:[{text:"Здравствуйте!",ja:"こんにちは。",words:[{word:"Здравствуйте",meaning:"丁寧な挨拶"}],grammar:"初対面や目上の人にも使える挨拶。"},{text:"Где находится вокзал?",ja:"駅はどこですか。",words:[{word:"где",meaning:"どこ"},{word:"вокзал",meaning:"鉄道駅"}],grammar:"Где находится ... ? は場所を尋ねる表現。"}]}];
const $=id=>document.getElementById(id);let library;try{library=JSON.parse(localStorage.getItem("pf_library"))||samples}catch{library=samples}let lesson=0,index=0,auto=false,repeat=false,playing=false;const synth=window.speechSynthesis;function save(){localStorage.setItem("pf_library",JSON.stringify(library))}function options(){ $("lesson").replaceChildren(...library.map((x,i)=>new Option(x.title,i)));$("lesson").value=lesson}function stop(){auto=false;playing=false;synth?.cancel();$("auto").textContent="連続再生：OFF";$("play").textContent="▶ 再生"}function render(){let l=library[lesson],p=l.phrases[index];$("counter").textContent=(index+1)+" / "+l.phrases.length+" · "+l.lang;$("phrase").textContent=p.text;$("translation").textContent=p.ja;$("translation").classList.toggle("hidden",!$("showTranslation").checked);$("words").replaceChildren(...(p.words||[]).map(w=>{let li=document.createElement("li");li.textContent=w.word+" — "+w.meaning;return li}));$("grammar").textContent=p.grammar||"解説なし";$("prev").disabled=index===0;$("next").disabled=index===l.phrases.length-1}function speak(){if(!synth){$("message").textContent="このブラウザは読み上げに対応していません";return} synth.cancel();let p=library[lesson].phrases[index],u=new SpeechSynthesisUtterance(p.text);u.lang=library[lesson].lang;u.rate=Number($("speed").value);u.onend=()=>{playing=false;$("play").textContent="▶ 再生";if(auto){if(repeat){setTimeout(()=>auto&&speak(),900)}else if(index+1<library[lesson].phrases.length){index++;render();setTimeout(()=>auto&&speak(),900)}else{auto=false;$("auto").textContent="連続再生：OFF"}}};u.onerror=()=>{playing=false;auto=false;$("auto").textContent="連続再生：OFF";$("play").textContent="▶ 再生"};playing=true;$("play").textContent="■ 停止";synth.speak(u)}$("lesson").onchange=e=>{stop();lesson=Number(e.target.value);index=0;render()};$("prev").onclick=()=>{stop();index=Math.max(0,index-1);render()};$("next").onclick=()=>{stop();index=Math.min(library[lesson].phrases.length-1,index+1);render()};$("reset").onclick=()=>{stop();index=0;render()};$("play").onclick=()=>{if(playing){stop()}else speak()};$("auto").onclick=()=>{auto=!auto;$("auto").textContent="連続再生："+(auto?"ON":"OFF");if(auto&&!playing)speak()};$("repeat").onclick=()=>{repeat=!repeat;$("repeat").textContent="リピート："+(repeat?"ON":"OFF")};$("showTranslation").onchange=render;$("import").onclick=()=>{try{let x=JSON.parse($("json").value);if(!x.title||!x.lang||!Array.isArray(x.phrases)||!x.phrases.length||x.phrases.some(p=>!p.text||!p.ja))throw Error("title、lang、phrases（textとja）が必要です");library.push(x);save();stop();lesson=library.length-1;index=0;options();render();$("json").value="";$("message").textContent="教材を追加しました"}catch(e){$("message").textContent="取り込み失敗："+e.message}};$("export").onclick=()=>{let blob=new Blob([JSON.stringify(library,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="phraseflow-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};options();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script><script>
(()=>{
const $=id=>document.getElementById(id), read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}, write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const anchor=$("old-phrase-anchor");$("mode-phrases").append(...Array.from(anchor.children).slice(0,2));anchor.style.display="none";
const tabs=document.querySelectorAll("[data-tab]");function switchTab(t){window.speechSynthesis?.cancel();wAuto=false;tabs.forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.querySelectorAll(".mode").forEach(m=>m.classList.toggle("active",m.id==="mode-"+t));if(t==="words")renderW();if(t==="grammar")renderG()}tabs.forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
const languages=[["en-US","英語"],["ru-RU","ロシア語"],["fr-FR","フランス語"],["zh-CN","中国語"],["ko-KR","韓国語"],["es-MX","スペイン語"],["ar-SA","アラビア語"],["pt-BR","ポルトガル語"],["hi-IN","ヒンディー語"],["de-DE","ドイツ語"]];
let wordBooks=read("pf_words",[{title:"英語・単語サンプル",lang:"en-US",words:[{text:"understand",ja:"理解する",pos:"動詞",example:"I understand the question.",exampleJa:"私は質問を理解しています。",note:"過去形・過去分詞 understood"},{text:"weather",ja:"天気",pos:"名詞",example:"The weather is nice today.",exampleJa:"今日は天気がいいです。"}]}]);
let grammarBooks=read("pf_grammar",[{title:"英語・基本文法サンプル",lang:"en-US",lessons:[{title:"第1課：be動詞",explanation:"be動詞は主語の状態や性質を表します。現在形は主語に応じて am / is / are に変化します。\n例：I am / You are / She is",examples:[{text:"She is a student.",ja:"彼女は学生です。"}]},{title:"第2課：一般動詞の現在形",explanation:"一般動詞は動作や習慣を表します。主語が三人称単数のときは、通常動詞に -s / -es を付けます。",examples:[{text:"He studies English.",ja:"彼は英語を勉強しています。"}]}]}]);
let learned=read("pf_learned",{}),completed=read("pf_completed",{}),wi=0,wbi=0,gi=0,gbi=0,wAuto=false,wRepeat=false,wPlaying=false,wToken=0;
function tts(text,lang,rate,done){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.onend=()=>done?.();u.onerror=()=>{wAuto=false;$("wordAuto").textContent="連続再生：OFF";wPlaying=false;$("wordPlay").textContent="▶ 再生"};window.speechSynthesis.speak(u)}
function opts(id,books,selected){$(id).replaceChildren(...books.map((b,i)=>new Option(b.title+" ("+b.lang+")",i)));$(id).value=selected}
function wKey(){return wordBooks[wbi].lang+"|"+wordBooks[wbi].title+"|"+wordBooks[wbi].words[wi].text}
function renderW(){if(!wordBooks.length)return;opts("wordLesson",wordBooks,wbi);let b=wordBooks[wbi],w=b.words[wi];$("wordCount").textContent=(wi+1)+" / "+b.words.length+" · "+b.lang;$("wordText").textContent=w.text;$("wordMeaning").textContent=$("wordShow").checked?w.ja:"（日本語訳は非表示）";$("wordDetails").replaceChildren();let d=$("wordDetails");[["品詞",w.pos],["活用・補足",w.note||w.forms],["例文",w.example],["例文訳",w.exampleJa]].forEach(([k,v])=>{if(v){let p=document.createElement("p");p.textContent=k+"："+v;d.append(p)}});$("examplePlay").disabled=!w.example;$("wordPrev").disabled=wi===0;$("wordNext").disabled=wi===b.words.length-1;let count=b.words.filter(x=>learned[b.lang+"|"+b.title+"|"+x.text]).length;$("wordProgress").textContent="習得済み "+count+" / "+b.words.length;$("wordLearned").textContent=learned[wKey()]?"✓ 習得済み（解除する）":"✓ 習得済みにする"}
function wStop(){wToken++;wAuto=false;wPlaying=false;window.speechSynthesis?.cancel();$("wordAuto").textContent="連続再生：OFF";$("wordPlay").textContent="▶ 再生"}
function wSpeak(){let token=++wToken,b=wordBooks[wbi],w=b.words[wi];wPlaying=true;$("wordPlay").textContent="■ 停止";tts(w.text,b.lang,Number($("wordSpeed").value),()=>{if(token!==wToken)return;wPlaying=false;$("wordPlay").textContent="▶ 再生";if(wAuto){setTimeout(()=>{if(token!==wToken||!wAuto)return;if(!wRepeat){if(wi+1>=b.words.length){wAuto=false;$("wordAuto").textContent="連続再生：OFF";return}wi++;renderW()}wSpeak()},700)}})}
$("wordLesson").onchange=e=>{wStop();wbi=+e.target.value;wi=0;renderW()};$("wordPrev").onclick=()=>{wStop();wi=Math.max(0,wi-1);renderW()};$("wordNext").onclick=()=>{wStop();wi=Math.min(wordBooks[wbi].words.length-1,wi+1);renderW()};$("wordPlay").onclick=()=>wPlaying?wStop():wSpeak();$("wordAuto").onclick=()=>{wAuto=!wAuto;$("wordAuto").textContent="連続再生："+(wAuto?"ON":"OFF");if(wAuto&&!wPlaying)wSpeak()};$("wordRepeat").onclick=()=>{wRepeat=!wRepeat;$("wordRepeat").textContent="リピート："+(wRepeat?"ON":"OFF")};$("wordShow").onchange=renderW;$("examplePlay").onclick=()=>{wStop();let b=wordBooks[wbi];tts(b.words[wi].example,b.lang,Number($("wordSpeed").value))};$("wordLearned").onclick=()=>{let k=wKey();if(learned[k])delete learned[k];else learned[k]=true;write("pf_learned",learned);renderW()};
function gKey(){return grammarBooks[gbi].lang+"|"+grammarBooks[gbi].title+"|"+gi}
function renderG(){if(!grammarBooks.length)return;opts("grammarLesson",grammarBooks,gbi);let b=grammarBooks[gbi],g=b.lessons[gi];$("grammarCount").textContent=(gi+1)+" / "+b.lessons.length+" · "+b.lang;$("grammarTitle").textContent=g.title;$("grammarBody").textContent=g.explanation||g.body||"";$("grammarExamples").replaceChildren(...(g.examples||[]).map(ex=>{let p=document.createElement("p");let span=document.createElement("span");span.textContent=ex.text+" — "+(ex.ja||"")+" ";let btn=document.createElement("button");btn.textContent="▶";btn.onclick=()=>tts(ex.text,b.lang,1);p.append(span,btn);return p}));$("grammarPrev").disabled=gi===0;$("grammarNext").disabled=gi===b.lessons.length-1;$("grammarDone").textContent=completed[gKey()]?"✓ 完了済み（解除する）":"✓ この課を完了";$("grammarProgress").textContent="完了 "+b.lessons.filter((_,i)=>completed[b.lang+"|"+b.title+"|"+i]).length+" / "+b.lessons.length}
$("grammarLesson").onchange=e=>{window.speechSynthesis?.cancel();gbi=+e.target.value;gi=0;renderG()};$("grammarPrev").onclick=()=>{window.speechSynthesis?.cancel();gi--;renderG()};$("grammarNext").onclick=()=>{window.speechSynthesis?.cancel();gi++;renderG()};$("grammarDone").onclick=()=>{let k=gKey();if(completed[k])delete completed[k];else completed[k]=true;write("pf_completed",completed);renderG()};
$("newImport").onclick=()=>{try{let x=JSON.parse($("newJson").value),type=x.type|| (x.words?"words":x.lessons?"grammar":"phrases");if(!x.title||!x.lang)throw Error("titleとlangが必要です");if(type==="words"){if(!Array.isArray(x.words)||!x.words.length||x.words.some(w=>!w.text||!w.ja))throw Error("wordsにはtextとjaが必要です");wordBooks.push(x);write("pf_words",wordBooks);wbi=wordBooks.length-1;wi=0;switchTab("words")}else if(type==="grammar"){if(!Array.isArray(x.lessons)||!x.lessons.length||x.lessons.some(g=>!g.title||!(g.explanation||g.body)))throw Error("lessonsにはtitleとexplanationが必要です");grammarBooks.push(x);write("pf_grammar",grammarBooks);gbi=grammarBooks.length-1;gi=0;switchTab("grammar")}else if(type==="phrases"){if(!Array.isArray(x.phrases)||!x.phrases.length||x.phrases.some(p=>!p.text||!p.ja))throw Error("phrasesにはtextとjaが必要です");library.push(x);save();lesson=library.length-1;index=0;options();render();switchTab("phrases")}else throw Error("typeはwords / grammar / phrases");$("newJson").value="";$("newMessage").textContent="教材を追加しました"}catch(e){$("newMessage").textContent="取り込み失敗："+e.message}};
$("backupAll").onclick=()=>{let data={version:2,phrases:library,words:wordBooks,grammar:grammarBooks,learned,completed};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));let a=document.createElement("a");a.href=url;a.download="phraseflow-v02-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderW();renderG();
})();
</script></body></html>
